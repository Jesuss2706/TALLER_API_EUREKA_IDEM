spring.application.name=servidor-transacciones
server.port=${PUERTO:8080}

# Base de datos H2 en archivo: el historial se conserva aunque se reinicie el servidor
# (necesario porque para cambiar la simulacion de fallos hay que reiniciar con otras variables de entorno)
spring.datasource.url=jdbc:h2:file:./data/transaccionesdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# ------------------------------------------------------------------
# Simulacion de fallos de comunicacion (se activan con variables de entorno)
#   SIMULAR_FALLO_PETICION     true/false -> se "pierde" el mensaje de peticion (la transaccion NO se procesa)
#   SIMULAR_FALLO_RESPUESTA    true/false -> se procesa la transaccion pero se "pierde" el mensaje de respuesta
#   REINTENTOS_PARA_RESPONDER  numero de reintentos que debe hacer el cliente antes de que el servidor responda
#                              0 = responde al primer intento, 1 = al primer reintento, ... 5 o mas = nunca
#                              Por defecto 1: si solo se activa un fallo, el primer intento falla y responde en el reintento 1
#   RETARDO_FALLO_MS           tiempo que el servidor "retiene" un mensaje perdido (debe superar el timeout del cliente: 3 s)
# ------------------------------------------------------------------
simulacion.fallo-peticion=${SIMULAR_FALLO_PETICION:false}
simulacion.fallo-respuesta=${SIMULAR_FALLO_RESPUESTA:false}
simulacion.reintentos-para-responder=${REINTENTOS_PARA_RESPONDER:1}
simulacion.retardo-ms=${RETARDO_FALLO_MS:5000}
